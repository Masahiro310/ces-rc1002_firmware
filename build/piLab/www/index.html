			$(function () {
				$("#menu").load("menu.html");
				$("#contents").load("unitSetting.html");
				unitTimeTimer = setInterval(function () {
					unit_time.setSeconds(unit_time.getSeconds() + 1);
					setUnitDateTime(unit_time);
					setPcDateTime();
				}, 1000);
			});

			//// 日時設定用のタイマーイベントを呼び出しておく
			let unit_time = new Date();
			let month = ["01", "02", "03", "04", "05", "06", "07", "08", "09", "10", "11", "12"];
			function setUnitDateTime(date) {
				$("#now_date_time").text(
					date.getFullYear() + "/" + month[Number(date.getMonth())] + "/" + ("0"+date.getDate()).slice(-2) + " " + ("0"+date.getHours()).slice(-2) + ":" + ("0"+date.getMinutes()).slice(-2) + ":" + ("0"+date.getSeconds()).slice(-2)
				);
			}
			function setPcDateTime() {
				if($("input:radio[name=time_sync]:checked").val()=="manual"
					&& $('#pc_sync').prop('checked')){
					var now = new Date();
					$("#date").val(
						now.getFullYear() +
							"/" +
							month[Number(now.getMonth())] +
							"/" +
							("0" + now.getDate()).slice(-2)
					);
					$("#hour_time").val(("0" + now.getHours()).slice(-2));
					$("#minute_time").val(("0" + now.getMinutes()).slice(-2));
					$("#second_time").val(("0" + now.getSeconds()).slice(-2));
					}
			}

			function loadHtml(html) {
				$(function () {
					$("#contents").load(html);
				});
			}
