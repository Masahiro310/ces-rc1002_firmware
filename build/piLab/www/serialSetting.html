<script>
	var setPelcoInfoUrl = "cgi-bin/setPelcoInfo.php";
	var getPelcoInfoUrl = "cgi-bin/getPelcoInfo.php";

	function getPelcoInfo() {
		$.ajax({
			async: true,
			url: getPelcoInfoUrl,
			type: "POST",
			dataType: "json",
			success: function (pelcoInfo) {
				$("#serialSpeed").val(pelcoInfo.serialSpeed);
				if ($("#serialSpeed").val() == null || $("#serialSpeed").val() === "") {
						$("#serialSpeed").val("38400");
				}
				$("#camera_id").val(pelcoInfo.camera_id);
				if ($("#camera_id").val() == null || $("#camera_id").val() === "") {
						$("#camera_id").val("1");
				}
				$("#turntable_id").val(pelcoInfo.turntable_id);
				if ($("#turntable_id").val() == null || $("#turntable_id").val() === "") {
						$("#turntable_id").val("2");
				}
				$("#pt_hiSpeed").val(pelcoInfo.pt_hiSpeed);
				if ($("#pt_hiSpeed").val() == null || $("#pt_hiSpeed").val() === "") {
						$("#pt_hiSpeed").val("63");
				}
				$("#pt_loSpeed").val(pelcoInfo.pt_loSpeed);
				if ($("#pt_loSpeed").val() == null || $("#pt_loSpeed").val() === "") {
						$("#pt_loSpeed").val("1");
				}
			},
		});
	}

	function setPelcoSetting() {
		$.blockUI();
		var send_data =
			"serialSpeed=" +
			$("#serialSpeed").val() +
			"&" +
			"camera_id=" +
			$("#camera_id").val() +
			"&" +
			"turntable_id=" +
			$("#turntable_id").val() +
			"&" +
			"pt_hiSpeed=" +
			$("#pt_hiSpeed").val() +
			"&" +
			"pt_loSpeed=" +
			$("#pt_loSpeed").val();
		$.ajax({
			async: true,
			url: setPelcoInfoUrl,
			data: send_data,
			type: "POST",
			dataType: "json",
			success: function (res) {
				$.unblockUI();
				if (res["status"] == 2){
					// apache自動再起動
				}
				else if (res["status"] != 0) {
					alert(res["message"]);
				}
			},
			error: function (xhr, ajaxOptions, thrownError) {
				getNetworkSetting();
				$.unblockUI();
			},
		});

	}

	$(function () {
		getPelcoInfo();
		$("#pelco_setting").click(function () {
			setPelcoSetting();
		});
		$("#clear_setting").click(function () {
			getPelcoInfo();
		});
	});
</script>
