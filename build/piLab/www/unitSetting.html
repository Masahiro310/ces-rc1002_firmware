<!DOCTYPE html>
<meta charset="utf-8" />

<script type="text/javascript" src="js/jquery.numeric.min.js"></script>
<script>
	var setUnitUrl = "cgi-bin/setUnitSetting.php";
	var setNetworkUrl = "cgi-bin/setNetworkInfo.php";
	var getNetworkUrl = "cgi-bin/getNetworkInfo.php";
	var getUserUrl = "cgi-bin/getUserInfo.php";
	var getSensitivityUrl = "cgi-bin/getSensitivityInfo.php";

	function getNetworkSetting() {
		$.ajax({
			async: true,
			url: getNetworkUrl,
			type: "POST",
			dataType: "json",
			success: function (network) {
				$("#ipaddr1").val(network.ipaddr1);
				$("#ipaddr2").val(network.ipaddr2);
				$("#ipaddr3").val(network.ipaddr3);
				$("#ipaddr4").val(network.ipaddr4);
				$("#subnet").val(network.subnet);
				$("#gateway1").val(network.gateway1);
				$("#gateway2").val(network.gateway2);
				$("#gateway3").val(network.gateway3);
				$("#gateway4").val(network.gateway4);
				$("#http_port").val(network.http_port);
				$("#dns1").val(network.dns1);
				$("#dns2").val(network.dns2);
				$("#dns3").val(network.dns3);
				$("#dns4").val(network.dns4);
			},
		});
	}
	function getUserSetting() {
		$.ajax({
			async: true,
			url: getUserUrl,
			type: "POST",
			dataType: "json",
			success: function (network) {
				$("#user").val(network.user);
				$("#password").val(network.password);
				$("#conf_pass").val(network.password);
				$("#unit_password").val(network.unit_password);
			},
		});
	}

	function getSensitivity() {
		$.ajax({
			async: true,
			url: getSensitivityUrl,
			type: "POST",
			dataType: "json",
			success: function (network) {
				$("#pan_sensitivity").val(network.pan_sensitivity);
				$("#tilt_sensitivity").val(network.tilt_sensitivity);
				$("#zoom_sensitivity").val(network.zoom_sensitivity);
				$("#stop_area").val(network.stop_area);
				if ($("#stop_area").val() == null || $("#stop_area").val() === "") {
						$("#stop_area").val("10");
				}
			},
		});
	}

	function setUnitSetting() {
		$.blockUI();
		var send_data =
			"ipaddr1=" +
			$("#ipaddr1").val() +
			"&" +
			"ipaddr2=" +
			$("#ipaddr2").val() +
			"&" +
			"ipaddr3=" +
			$("#ipaddr3").val() +
			"&" +
			"ipaddr4=" +
			$("#ipaddr4").val() +
			"&" +
			"subnet=" +
			$("#subnet").val() +
			"&" +
			"gateway1=" +
			$("#gateway1").val() +
			"&" +
			"gateway2=" +
			$("#gateway2").val() +
			"&" +
			"gateway3=" +
			$("#gateway3").val() +
			"&" +
			"gateway4=" +
			$("#gateway4").val() +
			"&" +
			"http_port=" +
			$("#http_port").val() +
			"&" +
			"dns1=" +
			$("#dns1").val() +
			"&" +
			"dns2=" +
			$("#dns2").val() +
			"&" +
			"dns3=" +
			$("#dns3").val() +
			"&" +
			"dns4=" +
			$("#dns4").val() +
			"&" +
			"user=" +
			encodeURIComponent($("#user").val()) + 
			"&" +
			"password=" +
			encodeURIComponent($("#password").val()) +
			"&" +
			"conf_pass=" +
			encodeURIComponent($("#conf_pass").val()) +
			"&" +
			"unit_password=" +
			$("#unit_password").val() +
			"&" +
			"pan_sensitivity=" +
			$("#pan_sensitivity").val() +
			"&" +
			"tilt_sensitivity=" +
			$("#tilt_sensitivity").val() +
			"&" +
			"zoom_sensitivity=" +
			$("#zoom_sensitivity").val() +
			"&" +
			"stop_area=" +
			$("#stop_area").val();
		$.ajax({
			async: true,
			url: setUnitUrl,
			data: send_data,
			type: "POST",
			dataType: "json",
			success: function (res) {
				$.unblockUI();
				if (res["status"] == 2){
					// apache自動再起動
				}
				else if (res["status"] != 0) {
					alert(res["message"]);
				}
				else{
					// execute_restart("during_network_setting", "AILEUN_APP_REBOOT");
					$('#during_network_setting').dialog('open');
				}
			},
			error: function (xhr, ajaxOptions, thrownError) {
				getNetworkSetting();
				$.unblockUI();
			},
		});

	}
	function clearNetworkSetting() {
		$("#ipaddr1").val("");
		$("#ipaddr2").val("");
		$("#ipaddr3").val("");
		$("#ipaddr4").val("");
		$("#subnet").val("24");
		$("#gateway1").val("");
		$("#gateway2").val("");
		$("#gateway3").val("");
		$("#gateway4").val("");
		$("#http_port").val("80");
		$("#dns1").val("");
		$("#dns2").val("");
		$("#dns3").val("");
		$("#dns4").val("");
	}
	function clearUserSetting() {
		$("#user").val("");
		$("#password").val("");
		$("#conf_pass").val("");
		$("#unit_password").val("");
	}
	// ネットワーク設定実行完了ダイアログ
	$("#during_network_setting").dialog({
		modal: true,
		autoOpen: false,
		width: 350,
		resizable: false,
		open: function (event, ui) {
			$(".ui-dialog-titlebar-close").hide();
		},
		buttons: {
			OK: function () {
				$(this).dialog("close");
			},
		},
	});

	$(function () {
		getNetworkSetting();
		getUserSetting();
		getSensitivity();
		$("#network_setting").click(function () {
			setUnitSetting();
		});
		$("#clear_setting").click(function () {
			getNetworkSetting();
			getUserSetting();
			getSensitivity();
		});
	});
</script>

	<script type="text/javascript">
		$(".numeric").numeric();
		$(".integer").numeric(false, function () {
			alert("Integers only");
			this.value = "";
			this.focus();
		});
		$(".positive").numeric({ negative: false }, function () {
			alert("No negative values");
			this.value = "";
			this.focus();
		});
		$(".positive-integer").numeric({ decimal: false, negative: false }, function () {
			alert("不正な文字（制御文字等）が使用されています");
			this.value = "";
			this.focus();
		});
		$(".decimal-2-places").numeric({ decimalPlaces: 2 });
		$(".alternative-decimal-separator").numeric({ altDecimal: "," });
		$(".alternative-decimal-separator-reverse").numeric({
			altDecimal: ".",
			decimal: ",",
		});
		$("#remove").click(function (e) {
			e.preventDefault();
			$(".numeric,.integer,.positive,.positive-integer,.decimal-2-places,.alternative-decimal-separator,.alternative-decimal-separator-reverse").removeNumeric();
		});
	</script>
